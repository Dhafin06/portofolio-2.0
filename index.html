
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#0d0f12" />
    <meta name="description" content="Dhafin Aksanidra portfolio." />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Portfolio</title>

    <!-- Apply the initial theme before React loads -->
    <script>
      (() => {
        try {
          const storageKey = "theme";
          const savedTheme = localStorage.getItem(storageKey);
          const systemPrefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;

          const theme = savedTheme || "system";
          const isDark =
            theme === "dark" ||
            (theme === "system" && systemPrefersDark);

          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark
            ? "dark"
            : "light";
        } catch {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>

    <style>
      html {
        min-height: 100%;
        background-color: #f5f5f5;
      }

      html.dark {
        background-color: #0d0f12;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
      }

      html.dark body {
        background-color: #0d0f12;
      }

      #root {
        min-height: 100vh;
        background-color: transparent;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
